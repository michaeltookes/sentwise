# Reachability guard for the managed inference controls on the Settings AI tab.
# In hunt mode the seeded fixture has managed inference active but no signed-in
# account, so the managed sign-in controls render immediately. Read-only — it
# never activates them (the deterministic flows are exercised by the
# managed-signin-* hunts).
#
# Run it (on the Lucius runner):  prowl run ai-provider-controls

name: ai-provider-controls
description: Managed AI sign-in controls render on the Settings AI tab

steps:
  - click:
      selector: statusItem

  - click:
      selector: id=openSettings

  - waitForSelector:
      selector: label="Sentwise Settings"
      timeout: 10000

  - click:
      selector: label="AI"

  # Managed-inference sign-in controls (managed is the active fixture provider,
  # not yet signed in).
  - assert:
      visible: id=managedGoogleSignInButton
  - assert:
      visible: id=managedEmailField
  - assert:
      visible: id=managedSendCodeButton
