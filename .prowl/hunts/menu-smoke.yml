# Smoke test: the status item exists, its menu opens, and every hunt-safe
# menu action is present — including the account-gated items unlocked by the
# seeded fixture account (follow-up composer, review window, mailbox browser).
# Read-only.
#
# Run it:  prowl run menu-smoke

name: menu-smoke
description: Open the status-item menu and verify all safe actions exist

steps:
  # `statusItem` is the macOS target's magic selector: find the app's menu bar
  # extra and press it, leaving the menu open for the assertions below.
  - click:
      selector: statusItem

  # Always-present items.
  - assert:
      visible: id=openSetupAssistant

  - assert:
      visible: id=openSettings

  - assert:
      visible: id=openActivityMenu

  # Account-gated items — only exist because hunt mode seeds a fixture
  # account and one pending draft. If these fail, the seeding regressed.
  - assert:
      visible: id=openFollowUpComposer

  - assert:
      visible: id=openReviewWindow

  - assert:
      visible: id=openBrowseMailbox

  # Report a Problem (item 36) — assert the feedback entry point is present.
  # Read-only: the hunt never activates it (in hunt mode the mailto/Finder side
  # effects are suppressed anyway; the diagnostics file is still written on click,
  # so we assert-only). Activation stays blocked by the "Report a Problem" label
  # forbid in config.yml.
  - assert:
      visible: id=reportAProblem
