# Prowl configuration — Sentwise macOS menu bar app (experimental macOS target).
# Requires the locally-built prowl CLI (npm link from the prowl repo) and its
# prowl-macdriver Swift helper. See .prowl/README.md for setup and permissions.
#
# Hunt mode launches with a seeded in-memory fixture account (see
# ProwlHuntRuntime.swift) so the account-gated surfaces — follow-up composer,
# review window, mailbox browser — are reachable. The fixture uses `.invalid`
# hosts and no LLM key, so nothing can reach a real mail server or provider.

target:
  type: macos
  app: .prowl/DerivedData/Build/Products/Debug/Sentwise.app

browser:
  timeout: 30000        # also bounds app-launch wait for the macOS target

artifacts:
  screenshots: "on-failure"   # screenshots need Screen Recording permission

# Safety guardrails. forbiddenSelectors is substring-matched against every
# selector. Hunts are open-and-assert only for everything that mutates real
# state — they may open windows but never trigger an action that dispatches mail,
# mutates a draft, calls an LLM, runs a mailbox search, or touches system
# settings. The substring selector families (`menu=`, `text=`) stay disabled
# because short substrings can resolve to unsafe menu items; menu actions must
# use the explicit AX identifiers the app assigns to safe items
# (`id=openSettings`, `id=openActivityMenu`, `id=openSetupAssistant`,
# `id=openFollowUpComposer`, `id=openReviewWindow`, `id=openBrowseMailbox`).
#
# EXCEPTION — item-59 sign-in / provider surfaces (relaxed 2026-08-21, item 70).
# In hunt mode ALL of managed sign-in (email code + Google) and OpenRouter
# provisioning run through a deterministic, fully-offline fake (see
# `AppState+ProwlHuntAuth.swift`, `startManagedSignIn`, `verifyManagedCode`,
# `startManagedGoogleSignIn`, `completeOpenRouterProvisioningForHunt`): no
# network, no browser, no Clerk/OpenRouter/Anthropic call, all against `.invalid`
# fixtures. Because activating those specific controls in hunt mode cannot reach
# a real service or send anything, the sign-in/provider hunts are allowed to
# click them. The relaxations and why each is safe:
#   * Removed the explicit `managed*` / `openRouter*` / `useThis*` id forbids and
#     the sign-in *label* forbids ("Sign in", "Verify", "Send sign-in code",
#     "Use Sentwise AI", "Continue with Google", "Connect OpenRouter",
#     "Use this provider") — these only drive the offline fake.
#   * Removed the standalone "Provider" substring — it also blocked the safe
#     `byoProviderPicker`, `useThisProviderButton`, and (non-interactive)
#     `activeProviderBadge`. Picking/staging a provider triggers no network.
#   * Removed the "Connect"/"connect", "Verify", and "Cancel" substrings — no
#     DANGEROUS control is named by them (mail uses "Test Connection", still
#     blocked by "Test"; canceling is harmless), and they collided with
#     `openRouterConnectButton` / `managedVerifyButton` / `managedCancelBrowserSignIn`.
#   * Replaced the bare "Send"/"send" substrings (which also matched
#     `managedSendCodeButton`) with QUOTE-ANCHORED forbids ('"Send"',
#     '"Send now"', '"Send anyway"') that match `label="Send"` /
#     `role=button[name="Send"]` — the real mail-dispatch buttons, which have no
#     AX id — but NOT `id=managedSendCodeButton`.
#   * Added an explicit "Disconnect" forbid (previously caught by "Connect").
# STILL FORBIDDEN so hunts can never send mail, call a real LLM, mutate a draft,
# search a mailbox, or change system settings: everything below. `getAPIKeyButton`
# and `useManagedInference` stay forbidden — the former opens a real browser (it
# is NOT hunt-gated) and the latter is not needed by any hunt.
#
# NOTE (item 69) — the Review Drafts window's Drafts/Skipped tab switch
# (`id=reviewDraftsTab`, `id=reviewSkippedTab`) is a READ-ONLY view toggle and is
# deliberately NOT forbidden: switching tab only changes which list is shown and
# reaches no approve/deny/send/draft/dismiss/clear action. Neither id collides
# with a forbidden substring (bare "Draft" is not forbidden — only "Draft anyway"
# etc. are — and "Skipped" is not forbidden). Do not add a broad "Draft"/"Tab"/
# "Skipped" substring forbid: it would break these safe switches without blocking
# any dangerous control (the real actions are already blocked by their own forbids).
guardrails:
  maxSteps: 25
  allowedApps:
    - .prowl/DerivedData/Build/Products/Debug/Sentwise.app
    - com.tookes.Sentwise
  forbiddenSelectors:
    # Substring selector families — too easy to hit an unsafe element.
    - "menu="
    - "text="
    # Mail dispatch / draft mutation inside the composer and review windows. The
    # real dispatch/approve buttons have no AX id, so they are matched by their
    # quote-anchored accessible name (blocks `label="Send"` /
    # `role=button[name="Send"]`, never `id=managedSendCodeButton`).
    - '"Send"'
    - '"Send now"'
    - '"Send anyway"'
    - "Approve"
    - "approve"
    - "Deny"
    - "deny"
    - "Discard"
    - "discard"
    - "Delete"
    - "delete"
    - "Save"
    - "save"
    - "Generate"
    - "generate"
    - "Draft follow-up"
    - "Draft reply"
    - "Draft a reply to this message"
    - "Draft anyway"
    - "Reply body"
    - "Follow-up recipients"
    - "Follow-up subject"
    - "Paste transcript text"
    - "Choose File"
    - "Clear"
    - "Dismiss"
    - "Regenerate"
    # Item 85 "answer in place and re-draft": Re-draft triggers a local regenerate
    # (same treatment as "Regenerate"); Write-it-yourself and the answer text
    # fields mutate draft content (same treatment as "Reply body"). Forbidden by
    # AX id and by accessible name so a hunt can see them (open-and-assert) but
    # never types an answer or fires a re-draft.
    - "redraftWithAnswers"
    - "Re-draft"
    - "writeItYourself"
    - "Write it yourself"
    - "needsInfoAnswerField"
    - "needsInfoExtraField"
    # Live-connection actions (settings test, mailbox search, watching). "Test"
    # still covers the mail "Test Connection" button; "Disconnect" is forbidden
    # explicitly now that the broad "Connect" substring is gone.
    - "Test"
    - "test"
    - "Disconnect"
    - "Search"
    - "search"
    - "Start"
    - "start"
    - "Pause"
    - "pause"
    - "Search keyword"
    - "Filter by sender"
    - "Since date"
    - "Before date"
    - "Select message from"
    - "Check all"
    - "Load more"
    - "View body"
    - "View message"
    - "Open message from"
    - "Preview cleanup"
    - "Preview recent inbox messages"
    - "Folder"
    - "Show"
    - "From"
    - "Cleanup"
    - "Mark read"
    - "Archive"
    - "Move to Trash"
    - "Stop"
    # Report a Problem (item 36): activation fires a live mailto + reveal-in-Finder
    # side effect, so it stays forbidden by its visible label. Its AX id is
    # deliberately NOT forbidden so the menu-smoke hunt can assert the entry point
    # is present (read-only) — the same relaxation applied to the sign-in controls,
    # and safe here because hunt mode suppresses the mailto/Finder side effects
    # (a click would only write a redacted file). Activation-by-name is still
    # blocked by the "Report a Problem" label forbid below.
    - "Report a Problem"
    # The verbose-logging toggle mutates persisted settings and stays FULLY
    # forbidden (id + label). The diagnostics-settings hunt asserts the Diagnostics
    # section via the non-interactive `diagnosticsSectionInfo` id instead, so it
    # never needs to reference this toggle.
    - "verboseDiagnosticLoggingToggle"
    - "Verbose diagnostic logging"
    # System-level toggles and app lifecycle.
    - "Login"
    - "login"
    - "Launch"
    - "launch"
    - "Check"
    - "check"
    - "Update"
    - "update"
    - "Quit"
    - "quit"
    # Settings/setup controls exposed by open-and-assert window hunts.
    - "Launch Sentwise at login"
    - "Inbox poll interval in seconds"
    - "What approving a draft does"
    - "On approve"
    - "Auto-send undo window"
    - "Undo window"
    - "Watch a folder for new call transcripts"
    - "Choose"
    - "Email address"
    - "App password"
    - "IMAP host"
    - "IMAP port"
    - "Port"
    - "Add another account"
    - "Add sender to allowlist"
    - "Add sender to blocklist"
    - "Add"
    - "Switch to"
    - "Remove "
    - "AI provider"
    - "AI model"
    - "AI provider base URL"
    - "AI provider API key"
    - "Model"
    - "Base URL"
    - "API key"
    - "Learn my voice"
    - "Re-learn my voice"
    - "Forget voice profile"
    # Signature controls (item 24). The picker and text editor mutate persisted
    # settings; "Suggest from my Sent mail" triggers a LIVE IMAP Sent-mail fetch.
    # All are open-and-assert forbidden. Forbidden by their unique AX ids and by
    # the visible labels/accessibility labels a hunt might resolve.
    - "signaturePolicyPicker"
    - "signatureTextEditor"
    - "suggestSignatureButton"
    - "Email signature policy"
    - "Custom email signature"
    - "Suggest signature from my Sent mail"
    - "Suggest from my Sent mail"
    - "Signature"
    - "Filter"
    - "Clear History"
    - "Back"
    - "Continue"
    - "Skip for now"
    - "Finish"
    # Managed-inference account actions that must stay off-limits even though the
    # fake makes them harmless: sign-out (state change), the browser-opening
    # "Get an API key" (NOT hunt-gated), and "Use Sentwise AI" (no hunt needs it).
    - "Sign out"
    - "managedSignOutButton"
    - "useManagedInference"
    - "getAPIKeyButton"
    - "Get an API key"
