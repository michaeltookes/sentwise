# Prowl QA — end-to-end acceptance hunts against the real Sentwise app.
#
# Drives the hunt-mode build (isolated fixture account, no live mailbox/LLM —
# see .prowl/README.md) through Prowl's experimental macOS target on a
# SELF-HOSTED macOS runner. GitHub-hosted macOS runners cannot run this: the
# runner's host process needs pre-granted Accessibility permission (and Screen
# Recording for failure screenshots), which only a machine you control can
# provide. Grant both to whatever hosts the runner agent (Terminal / launchd
# context) in System Settings → Privacy & Security before the first run.
#
# Runs as a PR gate for same-repository PR heads (promoted 2026-08-18 after the
# first green end-to-end run on the self-hosted runner) and stays manually
# triggerable via workflow_dispatch.

name: Prowl QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Keep in sync deliberately: the CLI and helper are both built from this source
# tag until the macOS target ships in the published npm package.
env:
  PROWL_VERSION: 0.1.4

jobs:
  prowl-qa:
    # Fork PR code is untrusted input for a persistent self-hosted GUI runner.
    # Keep this job on manual runs and same-repository PR heads only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The hunts drive a real GUI session. The single eligible self-hosted macOS
    # runner serializes runs through its native queue while preserving every PR
    # gate run.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout Sentwise
        uses: actions/checkout@v4

      - name: Guard swift-nio-imap pin (must stay below 0.5.0)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-nio-imap-pin.py

      - name: Checkout Prowl (CLI/helper source tag)
        uses: actions/checkout@v4
        with:
          repository: prowl-tools/prowl
          ref: v${{ env.PROWL_VERSION }}
          path: prowl-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and link Prowl CLI
        working-directory: prowl-src
        run: |
          npm install
          npm run build
          npm link

      - name: Build prowl-macdriver helper
        working-directory: prowl-src/macdriver
        run: |
          swift build -c release
          echo "PROWL_MACDRIVER_BIN=${GITHUB_WORKSPACE}/prowl-src/macdriver/.build/release/prowl-macdriver" >> "$GITHUB_ENV"

      - name: Preflight Accessibility permission
        run: |
          if ! "$PROWL_MACDRIVER_BIN" check; then
            echo "::error::Runner host is not trusted for Accessibility." \
              "Grant it in System Settings → Privacy & Security → Accessibility" \
              "on the runner machine (see .prowl/README.md), then re-run."
            exit 1
          fi

      - name: Build Sentwise (hunt mode)
        # The .prowl/DerivedData bundle path is what activates hunt mode's
        # fixture isolation (ProwlHuntRuntime.swift) — do not relocate it.
        run: |
          xcodebuild build \
            -project Sentwise/Sentwise.xcodeproj \
            -scheme Sentwise \
            -configuration Debug \
            -derivedDataPath .prowl/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run hunts
        run: prowl ci --junit

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prowl-runs
          path: .prowl/runs/
          if-no-files-found: ignore
          retention-days: 14
