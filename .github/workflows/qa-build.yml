name: QA build

# Builds the Sentwise QA DMG (item 123; docs/qa-build.md): the production code
# built with the QA configuration, pointed at the sandbox deployment of
# sentwise-service, the Clerk development instance, and the Paddle sandbox, and
# identified so it installs beside the production app (com.tookes.Sentwise.qa,
# "Sentwise QA", sentwise-qa://, its own Keychain service and data folder).
#
# Dispatch only. It NEVER tags, creates a release, writes an appcast, or bumps
# the Homebrew cask; the DMG is uploaded as a workflow artifact.
#
# Repository variables (public values; Settings > Secrets and variables > Variables):
#   SENTWISE_QA_CLERK_FRONTEND_API_URL     Clerk development instance Frontend API URL
#   SENTWISE_QA_PADDLE_CLIENT_TOKEN        Paddle sandbox client-side token (test_...)
#   SENTWISE_QA_PADDLE_STARTER_PRICE_ID    Paddle sandbox price ids (pri_...)
#   SENTWISE_QA_PADDLE_PRO_PRICE_ID
#   SENTWISE_QA_PADDLE_UNLIMITED_PRICE_ID
# Signing and notarization reuse the release secrets (MACOS_CERTIFICATE_P12,
# MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, NOTARY_APP_SPECIFIC_PASSWORD).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
        default: main
      signing:
        description: "developer-id (signed + notarized), developer-id-unnotarized, or unsigned (ad-hoc)"
        required: true
        type: choice
        options: [developer-id, developer-id-unnotarized, unsigned]
        default: developer-id
      require_checkout:
        description: "Fail unless the Clerk URL and all Paddle sandbox values are set"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: qa-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  qa-build:
    name: Build Sentwise QA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNING_MODE: ${{ inputs.signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: SwiftLint (strict)
        working-directory: Sentwise
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

      - name: Import Developer ID certificate
        if: env.SIGNING_MODE != 'unsigned'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sentwise-qa-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[",]//g')
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in the imported keychain." >&2
            exit 1
          fi
          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "SIGNING_KEYCHAIN_PW=$KEYCHAIN_PW"
          } >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Build the QA DMG
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          SENTWISE_CLERK_FRONTEND_API_URL: ${{ vars.SENTWISE_QA_CLERK_FRONTEND_API_URL }}
          SENTWISE_PADDLE_CLIENT_TOKEN: ${{ vars.SENTWISE_QA_PADDLE_CLIENT_TOKEN }}
          SENTWISE_PADDLE_STARTER_PRICE_ID: ${{ vars.SENTWISE_QA_PADDLE_STARTER_PRICE_ID }}
          SENTWISE_PADDLE_PRO_PRICE_ID: ${{ vars.SENTWISE_QA_PADDLE_PRO_PRICE_ID }}
          SENTWISE_PADDLE_UNLIMITED_PRICE_ID: ${{ vars.SENTWISE_QA_PADDLE_UNLIMITED_PRICE_ID }}
          REQUIRE_CHECKOUT: ${{ inputs.require_checkout }}
        run: |
          set -euo pipefail
          args=()
          case "$SIGNING_MODE" in
            unsigned) args+=(--unsigned) ;;
            developer-id) args+=(--notarize) ;;
            developer-id-unnotarized) ;;
          esac
          [[ "$REQUIRE_CHECKOUT" == "true" ]] && args+=(--require-checkout)
          if [[ "$SIGNING_MODE" != "unsigned" ]]; then
            security unlock-keychain -p "$SIGNING_KEYCHAIN_PW" "$SIGNING_KEYCHAIN"
          fi
          # Nounset-safe: an empty array is "unbound" under set -u in macOS
          # Bash 3.2 (developer-id-unnotarized without require_checkout).
          Distribution/scripts/qa-build.sh ${args[@]+"${args[@]}"}

      - name: Upload the QA DMG
        uses: actions/upload-artifact@v4
        with:
          name: sentwise-qa-${{ inputs.signing }}-${{ github.run_number }}
          path: |
            dist-qa/*.dmg
            dist-qa/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30
