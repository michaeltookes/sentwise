# Live tests — the env-gated live suite, executed on the Lucius Mac mini.
#
# This is the ONLY place the SENTWISE_LIVE_* tests actually run. They hit real
# services (Clerk, the sentwise-service Worker, Paddle sandbox, live IMAP
# mailboxes) and drafting spends real Anthropic budget, so they never run per
# PR-commit and never on a developer's machine — only here, on merge to main and
# on demand for a branch (via the /live-verify skill's workflow_dispatch).
#
# Runner: the SAME self-hosted macOS runner prowl-qa.yml targets — the Lucius Mac
# mini (labels [self-hosted, macOS]). WebKit's window server (the Paddle
# checkout-overlay test) and any GUI-dependent flow require the runner to be
# started from Lucius's on-console GUI (Aqua) session — `svc.sh` from that
# session, never over SSH/sudo (see docs/live-testing.md and .prowl/README.md).
# GitHub-hosted macOS runners cannot provide this.
#
# Trust: only workflow_dispatch (requires repo write access) and push-to-main
# (trusted, post-merge) trigger this — never a fork PR — so no untrusted code
# runs live against real credentials on the persistent runner.
#
# Keychain isolation (item 115): the runner is ALSO the Sentwise QA desktop,
# sharing one login keychain with the installed Developer ID app. A dev-signed
# test process rewriting items under the production service com.tookes.Sentwise
# resets their ACLs and locks the installed app behind a login-keychain
# password prompt (the 2026-10-11 incident). So this workflow (a) never
# terminates or launches /Applications/Sentwise.app — it fails fast instead if
# the installed app is running, (b) runs every test process with
# SENTWISE_TEST_KEYCHAIN=1 so KeychainStore uses the isolated
# com.tookes.Sentwise.tests service, and (c) snapshots the production items'
# modification dates before the run and fails loudly if any changed after.

name: Live tests

run-name: Live tests (${{ github.event.inputs.ref || github.ref_name }}) [${{ github.event.inputs.correlation_id || github.run_id }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out and live-verify on Lucius
        required: false
        default: main
      correlation_id:
        description: Opaque ID used by /live-verify to find the dispatched run
        required: false
  push:
    branches: [main]

jobs:
  live-tests:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Refuse to run beside the installed QA app
        # This workflow must never terminate or launch /Applications/Sentwise.app
        # (item 115). If the installed app is running, a same-bundle-id dev test
        # host launching next to it risks the exact interference that blinded QA
        # on 2026-10-11, so fail fast with instructions instead of touching it.
        run: |
          if pgrep -f "/Applications/Sentwise.app/Contents/MacOS/Sentwise" >/dev/null; then
            echo "::error::The installed /Applications/Sentwise.app is running on this runner (the shared QA desktop). This workflow never terminates or launches it — quit Sentwise on the QA desktop (status menu > Quit), then re-dispatch this run."
            exit 1
          fi
          echo "Installed QA app is not running; safe to proceed."

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Sentwise/Sentwise.xcodeproj \
            -scheme Sentwise \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Inject live env into the .xctestrun
        # Only the secrets actually provisioned are injected; any left unset make
        # their gated test skip cleanly (see Distribution/scripts/inject-live-env.sh).
        # The script logs variable NAMES only, so no secret reaches the CI log.
        env:
          # Not a secret: redirects every KeychainStore in the test-host process
          # to the isolated com.tookes.Sentwise.tests service (item 115).
          SENTWISE_TEST_KEYCHAIN: "1"
          SENTWISE_LIVE_PADDLE_CHECKOUT: ${{ secrets.SENTWISE_LIVE_PADDLE_CHECKOUT }}
          SENTWISE_LIVE_CLERK_TEST: ${{ secrets.SENTWISE_LIVE_CLERK_TEST }}
          SENTWISE_LIVE_CLERK_PRODUCTION_TEST_MODE: ${{ secrets.SENTWISE_LIVE_CLERK_PRODUCTION_TEST_MODE }}
          SENTWISE_LIVE_MANAGED_INFERENCE: ${{ secrets.SENTWISE_LIVE_MANAGED_INFERENCE }}
          SENTWISE_LIVE_MANAGED_DRAFT: ${{ secrets.SENTWISE_LIVE_MANAGED_DRAFT }}
          SENTWISE_LIVE_MANAGED_DRAFT_EMAIL: ${{ secrets.SENTWISE_LIVE_MANAGED_DRAFT_EMAIL }}
          SENTWISE_LIVE_MANAGED_PORTAL: ${{ secrets.SENTWISE_LIVE_MANAGED_PORTAL }}
          SENTWISE_LIVE_MANAGED_PORTAL_EMAIL: ${{ secrets.SENTWISE_LIVE_MANAGED_PORTAL_EMAIL }}
          SENTWISE_INFERENCE_URL: ${{ secrets.SENTWISE_INFERENCE_URL }}
          SENTWISE_LIVE_GMAIL_EMAIL: ${{ secrets.SENTWISE_LIVE_GMAIL_EMAIL }}
          SENTWISE_LIVE_GMAIL_APP_PASSWORD: ${{ secrets.SENTWISE_LIVE_GMAIL_APP_PASSWORD }}
          SENTWISE_LIVE_ATTNET_EMAIL: ${{ secrets.SENTWISE_LIVE_ATTNET_EMAIL }}
          SENTWISE_LIVE_ATTNET_APP_PASSWORD: ${{ secrets.SENTWISE_LIVE_ATTNET_APP_PASSWORD }}
        run: |
          XCTESTRUN=$(find build/Build/Products -maxdepth 1 -name "*.xctestrun" | head -1)
          echo "Injecting live env into $XCTESTRUN"
          Distribution/scripts/inject-live-env.sh "$XCTESTRUN"

      - name: Snapshot installed-app Keychain items (tripwire)
        # Records presence + mdat of every known item under the production
        # service BEFORE tests; the post-test verify fails the job if any
        # changed, catching any regression of the test-keychain isolation.
        # Attribute reads only — no secret values are read or logged.
        run: Distribution/scripts/keychain-tripwire.sh snapshot build/keychain-tripwire-state.txt

      - name: Run live tests
        # -only-testing keeps this to the env-gated live classes so the full unit
        # suite is not re-run here (it runs in prowl-qa / normal CI). Each class
        # self-skips when its gate secret is absent.
        # SENTWISE_TEST_KEYCHAIN reaches the test-host app via the .xctestrun
        # injection above; it is exported here too so any non-hosted process in
        # this step resolves the same isolated Keychain service (item 115).
        env:
          SENTWISE_TEST_KEYCHAIN: "1"
        run: |
          XCTESTRUN=$(find build/Build/Products -maxdepth 1 -name "*.xctestrun" | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=macOS' \
            -resultBundlePath build/LiveTests.xcresult \
            -only-testing:SentwiseTests/PaddleCheckoutLiveTests \
            -only-testing:SentwiseTests/ClerkLiveSignInTests \
            -only-testing:SentwiseTests/ManagedInferenceLiveTests \
            -only-testing:SentwiseTests/GmailLiveSendTests \
            -only-testing:SentwiseTests/ReplyWorthinessLiveTests \
            -only-testing:SentwiseTests/AttNetLiveDraftTests

      - name: Verify installed-app Keychain items unchanged (tripwire)
        # Runs even when the tests fail — a failing test must not hide a
        # Keychain-isolation regression. Skips only if the snapshot step never
        # ran (e.g. the build failed first).
        if: ${{ !cancelled() }}
        run: |
          if [[ ! -f build/keychain-tripwire-state.txt ]]; then
            echo "No tripwire snapshot found (earlier step failed before tests); skipping verify."
            exit 0
          fi
          Distribution/scripts/keychain-tripwire.sh verify build/keychain-tripwire-state.txt

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests-xcresult
          path: build/LiveTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
