<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!--
    DMG window background on the "Closer" palette (item 93, 2026-09-12). Light
    paper ground so the dark forest app-icon tile and the standard blue
    Applications folder both pop, and the baked dark-on-light text stays legible
    under both light and dark Finder themes. Colors are Closer @theme tokens
    from sentwise.ai globals.css: paper (#F6F8F5) -> mist (#E7EEE9) ground, an
    emerald-700 (#0B6E47) weave/arrow, ink (#0F1A16) title, slate (#55605A)
    caption. GEOMETRY IS BAKED: 660x400 window, 128px icons at (160,214) and
    (500,214) per make-dmg.sh — do not move the text/arrow into those drop zones.
  -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#F6F8F5"></stop>
      <stop offset="1" stop-color="#E7EEE9"></stop>
    </linearGradient>
    <pattern id="weave" width="12.73" height="12.73" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="12.73" fill="#0B6E47" opacity="0.05"></rect>
    </pattern>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"></rect>
  <rect width="660" height="400" fill="url(#weave)"></rect>

  <text x="330" y="62" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.2" fill="#0F1A16">Sentwise</text>
  <text x="330" y="84" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, Helvetica, sans-serif" font-size="11" letter-spacing="1.1" fill="#55605A">DRAG TO APPLICATIONS</text>


  <g fill="#0B6E47">
    <rect x="290" y="206" width="52" height="8" rx="4"></rect>
    <polygon points="348,197 366,210 348,223"></polygon>
  </g>
</svg>
